name: CI
 
on:
  push:
  pull_request:
 
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "app files andrd"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: chmod +x gradlew
        name: Make gradlew executable
      - run: ./gradlew test
        name: Run tests
        continue-on-error: true
      
      # Upload test reports as artifacts
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app files andrd/build/reports/tests/test/
          retention-days: 30
      
      # Parse and annotate test failures
      - name: Publish Test Report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: app files andrd/build/test-results/test/*.xml
          check_name: Test Results
